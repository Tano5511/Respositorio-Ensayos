<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Repertorio · Canciones y ensayos</title>
  <meta name="description" content="Organiza el repertorio de tu iglesia: canciones con letras y acordes, ensayos y buscador con filtros.">
  <meta name="theme-color" content="#0d1017">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/repertorios" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Repertorio</strong>
          <small id="churchLabel">Mi iglesia</small>
        </span>
      </a>

      <nav id="nav" class="nav" aria-label="Navegación principal"></nav>

      <div class="sidebar-foot">
        <button class="btn ghost block" data-action="new-song">+ Nueva canción</button>
        <p class="tiny muted">Tus datos se guardan en este dispositivo.</p>
      </div>
    </aside>

    <main class="main" id="main">
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Navegación"></nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-song.js"></script>
  <script src="js/view-songs.js"></script>
  <script src="js/view-setlists.js"></script>
  <script src="js/view-search.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
